<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gemini Universe</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            user-select: none;
        }

        /* Heads Up Display (HUD) */
        #hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
            background: rgba(0, 20, 40, 0.7);
            padding: 15px;
            border: 1px solid #00ffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }

        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background-color: #00ffff;
            border-radius: 50%;
        }

        /* Overlay for instructions */
        #instructions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
        }

        h1 { color: #00ffff; text-transform: uppercase; letter-spacing: 3px; }
        p { color: #aaa; font-size: 1.2rem; }
        .highlight { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="instructions">
        <h1>Gemini Space Engine</h1>
        <p>Click anywhere to initiate Flight Sequence</p>
        <p>Use <span class="highlight">W A S D</span> to fly. Use <span class="highlight">Mouse</span> to look around.</p>
        <p>Press <span class="highlight">ESC</span> to pause.</p>
    </div>

    <div id="crosshair"></div>

    <div id="hud">
        <div id="target-name" style="font-size: 1.5rem; color: #00ffff; font-weight: bold;">Target: Deep Space</div>
        <div id="target-dist">Distance: ---</div>
        <div id="speed-ind" style="margin-top: 10px; color: #aaa;">Engine Status: Idle</div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // --- 1. CORE SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.0002); // Deep space fade

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x222222);
        scene.add(ambientLight);

        // --- 2. GENERATE THE OBSERVABLE UNIVERSE (100 Objects) ---
        const universeObjects = [];
        const objectNames = ['Nebula', 'Red Dwarf', 'Blue Supergiant', 'Gas Giant', 'Rocky Exoplanet', 'Pulsar', 'Black Hole'];
        const group = new THREE.Group();
        scene.add(group);

        for (let i = 0; i < 100; i++) {
            const typeIndex = Math.floor(Math.random() * objectNames.length);
            const type = objectNames[typeIndex];
            
            let geometry, material, mesh;
            const size = Math.random() * 50 + 10;
            
            // Generate different types of celestial bodies
            if (type === 'Black Hole') {
                geometry = new THREE.SphereGeometry(size, 32, 32);
                material = new THREE.MeshBasicMaterial({ color: 0x000000 }); // Light cannot escape
                mesh = new THREE.Mesh(geometry, material);
                
                // Accretion disk
                const ringGeo = new THREE.TorusGeometry(size * 2, size * 0.2, 16, 100);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.7 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                mesh.add(ring);
            } 
            else if (type === 'Gas Giant') {
                geometry = new THREE.SphereGeometry(size, 32, 32);
                material = new THREE.MeshStandardMaterial({ 
                    color: Math.random() * 0xffffff, 
                    wireframe: Math.random() > 0.5 // Some look like wireframe holograms
                });
                mesh = new THREE.Mesh(geometry, material);
                
                // 30% chance for rings
                if(Math.random() > 0.7) {
                    const ringGeo = new THREE.TorusGeometry(size * 1.5, 2, 16, 100);
                    const ringMat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.rotation.x = Math.random() * Math.PI;
                    mesh.add(ring);
                }
            } 
            else if (type.includes('Dwarf') || type.includes('Supergiant') || type.includes('Pulsar')) {
                geometry = new THREE.SphereGeometry(size, 32, 32);
                const color = type.includes('Red') ? 0xff4444 : (type.includes('Blue') ? 0x4444ff : 0xffffff);
                material = new THREE.MeshBasicMaterial({ color: color }); // Glows in the dark
                mesh = new THREE.Mesh(geometry, material);
                
                // Add actual light source to stars
                const light = new THREE.PointLight(color, 2, 500);
                mesh.add(light);
            }
            else {
                geometry = new THREE.SphereGeometry(size, 32, 32);
                material = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff, roughness: 0.8 });
                mesh = new THREE.Mesh(geometry, material);
            }

            // Scatter them randomly in a massive 6000x6000x6000 area
            mesh.position.set(
                (Math.random() - 0.5) * 6000,
                (Math.random() - 0.5) * 6000,
                (Math.random() - 0.5) * 6000
            );

            // Assign data for the HUD Raycaster
            mesh.userData = { name: `${type} X-${Math.floor(Math.random() * 9000) + 1000}` };
            
            group.add(mesh);
            universeObjects.push(mesh);
        }

        // --- 3. BACKGROUND STARFIELD ---
        const starGeo = new THREE.BufferGeometry();
        const starCount = 10000;
        const starPos = new Float32Array(starCount * 3);
        for(let i=0; i<starCount*3; i++) {
            starPos[i] = (Math.random() - 0.5) * 10000;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({color: 0xffffff, size: 2});
        const starMesh = new THREE.Points(starGeo, starMat);
        scene.add(starMesh);

        // --- 4. FLIGHT CONTROLS & POINTER LOCK ---
        let isLocked = false;
        const instructions = document.getElementById('instructions');

        instructions.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === document.body) {
                isLocked = true;
                instructions.style.display = 'none';
            } else {
                isLocked = false;
                instructions.style.display = 'flex';
            }
        });

        // Mouse Look
        let pitch = 0;
        let yaw = 0;
        document.addEventListener('mousemove', (event) => {
            if (!isLocked) return;
            yaw -= event.movementX * 0.002;
            pitch -= event.movementY * 0.002;
            pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch)); // Prevent flipping over
            camera.rotation.set(pitch, yaw, 0, 'YXZ');
        });

        // Keyboard Movement (WASD)
        const keys = { w: false, a: false, s: false, d: false, shift: false };
        document.addEventListener('keydown', (e) => { 
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = true; 
        });
        document.addEventListener('keyup', (e) => { 
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false; 
        });

        // --- 5. TARGETING SYSTEM (RAYCASTER) ---
        const raycaster = new THREE.Raycaster();
        const center = new THREE.Vector2(0, 0); // Center of the screen
        const hudName = document.getElementById('target-name');
        const hudDist = document.getElementById('target-dist');
        const hudSpeed = document.getElementById('speed-ind');

        function updateTargeting() {
            raycaster.setFromCamera(center, camera);
            const intersects = raycaster.intersectObjects(universeObjects);

            if (intersects.length > 0) {
                const target = intersects[0];
                hudName.innerText = `Target: ${target.object.userData.name}`;
                hudDist.innerText = `Distance: ${Math.floor(target.distance)} Light Years`;
                document.getElementById('crosshair').style.borderColor = '#ffaa00';
                document.getElementById('crosshair').style.transform = 'translate(-50%, -50%) scale(1.5)';
            } else {
                hudName.innerText = `Target: Deep Space`;
                hudDist.innerText = `Distance: ---`;
                document.getElementById('crosshair').style.borderColor = 'rgba(0, 255, 255, 0.5)';
                document.getElementById('crosshair').style.transform = 'translate(-50%, -50%) scale(1)';
            }
        }

        // --- 6. ANIMATION & FLIGHT LOOP ---
        const direction = new THREE.Vector3();
        function animate() {
            requestAnimationFrame(animate);

            if (isLocked) {
                // Determine flight speed
                const speed = keys.shift ? 20 : 5; // Hold shift to boost
                hudSpeed.innerText = (keys.w || keys.a || keys.s || keys.d) ? `Engine Status: Active (Warp ${keys.shift ? '2' : '1'})` : `Engine Status: Idle`;

                // Calculate movement relative to camera direction
                direction.z = Number(keys.w) - Number(keys.s);
                direction.x = Number(keys.d) - Number(keys.a);
                direction.normalize();

                if (keys.w || keys.s) camera.translateZ(-direction.z * speed);
                if (keys.a || keys.d) camera.translateX(direction.x * speed);

                // Spin objects slowly for life-like effect
                universeObjects.forEach(obj => {
                    obj.rotation.y += 0.001;
                    obj.rotation.x += 0.0005;
                });

                // Run Targeting scanner
                updateTargeting();
            }

            renderer.render(scene, camera);
        }

        animate();

        // Handle Window Resizing gracefully
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
