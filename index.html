<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini Engine: Mobile Odyssey</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: 'Courier New', Courier, monospace; 
            color: #fff; 
            user-select: none; 
            touch-action: none; /* Prevents mobile scroll/zoom interference */
        }

        /* HUD & UI */
        #hud { position: absolute; top: 10px; left: 10px; pointer-events: none; z-index: 10; background: rgba(0, 20, 40, 0.7); padding: 10px; border: 1px solid #00ffff; border-radius: 5px; font-size: 0.8rem; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; border: 1px solid rgba(0, 255, 255, 0.4); border-radius: 50%; pointer-events: none; }
        
        #instructions { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; padding: 20px; cursor: pointer; }
        h1 { color: #00ffff; font-size: 1.5rem; margin-bottom: 10px; text-transform: uppercase; }

        /* Mobile Virtual Controls */
        #joystick-wrapper {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 20;
            display: none; /* Hidden on desktop */
        }
        #joystick-knob {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 40px;
            height: 40px;
            background: #00ffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ffff;
        }
        #boost-btn {
            position: absolute;
            bottom: 50px;
            right: 40px;
            width: 60px;
            height: 60px;
            background: rgba(255, 0, 255, 0.2);
            border: 2px solid #ff00ff;
            border-radius: 50%;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            color: #ff00ff;
            font-weight: bold;
            font-size: 0.7rem;
        }

        /* Show mobile UI only on small screens */
        @media (max-width: 1024px) {
            #joystick-wrapper, #boost-btn { display: block; }
        }
    </style>
</head>
<body>

    <div id="instructions" onclick="startEngine()">
        <h1>Gemini Space Engine</h1>
        <p>MOBILE: Use <span style="color:#00ffff">Joystick</span> to fly & Drag to look</p>
        <p>DESKTOP: <span style="color:#00ffff">WASD</span> to fly & Mouse to look</p>
        <div style="margin-top:20px; border:1px solid #00ffff; padding:10px 20px;">ENGAGE WARP DRIVE</div>
    </div>

    <div id="hud">
        <div id="target-name">Scanning Deep Space...</div>
        <div id="target-dist">Range: ---</div>
    </div>

    <div id="crosshair"></div>

    <div id="joystick-wrapper">
        <div id="joystick-knob"></div>
    </div>
    <div id="boost-btn">BOOST</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // --- 1. ENGINE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 20000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x333333));
        const sun = new THREE.PointLight(0xffffff, 2, 10000);
        scene.add(sun);

        // --- 2. STARS & PLANETS ---
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(6000 * 3);
        for(let i=0; i<18000; i++) starPos[i] = (Math.random() - 0.5) * 15000;
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 1.5, transparent: true}));
        scene.add(stars);

        const planets = [];
        const colors = [0xff4400, 0x00ffff, 0x44ff44, 0xffcc88, 0x2244ff];
        for (let i=0; i<30; i++) {
            const radius = 30 + Math.random() * 50;
            const p = new THREE.Mesh(
                new THREE.SphereGeometry(radius, 32, 32), 
                new THREE.MeshStandardMaterial({ color: colors[i%5], emissive: colors[i%5], emissiveIntensity: 0.1 })
            );
            p.position.set((Math.random()-0.5)*9000, (Math.random()-0.5)*9000, (Math.random()-0.5)*9000);
            p.userData = { name: "Planet " + (100+i) };
            scene.add(p);
            planets.push(p);
        }

        // --- 3. CONTROL STATES ---
        let isStarted = false;
        let moveX = 0, moveZ = 0, isBoosting = false;
        let pitch = 0, yaw = 0;
        const keys = { w:0, a:0, s:0, d:0, shift:0 };

        function startEngine() {
            isStarted = true;
            document.getElementById('instructions').style.display = 'none';
            if (!/Android|iPhone/i.test(navigator.userAgent)) {
                document.body.requestPointerLock();
            }
        }

        // --- 4. MOBILE TOUCH LOGIC ---
        const knob = document.getElementById('joystick-knob');
        const boostBtn = document.getElementById('boost-btn');
        let joyTouchId = null;
        let lookTouchId = null;
        let lastTouchX = 0, lastTouchY = 0;

        window.addEventListener('touchstart', (e) => {
            for(let t of e.changedTouches) {
                if (t.clientX < window.innerWidth / 2) {
                    joyTouchId = t.identifier;
                } else {
                    lookTouchId = t.identifier;
                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;
                }
            }
        });

        boostBtn.addEventListener('touchstart', (e) => { e.stopPropagation(); isBoosting = true; });
        boostBtn.addEventListener('touchend', () => isBoosting = false);

        window.addEventListener('touchmove', (e) => {
            if (!isStarted) return;
            for(let t of e.changedTouches) {
                if (t.identifier === joyTouchId) {
                    const rect = document.getElementById('joystick-wrapper').getBoundingClientRect();
                    const centerX = rect.left + 50;
                    const centerY = rect.top + 50;
                    let dx = t.clientX - centerX;
                    let dy = t.clientY - centerY;
                    const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
                    const angle = Math.atan2(dy, dx);
                    
                    knob.style.left = (30 + Math.cos(angle) * dist) + 'px';
                    knob.style.top = (30 + Math.sin(angle) * dist) + 'px';
                    
                    moveX = (Math.cos(angle) * dist) / 40;
                    moveZ = (Math.sin(angle) * dist) / 40;
                } else if (t.identifier === lookTouchId) {
                    const dx = t.clientX - lastTouchX;
                    const dy = t.clientY - lastTouchY;
                    yaw -= dx * 0.005;
                    pitch -= dy * 0.005;
                    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;
                }
            }
        });

        window.addEventListener('touchend', (e) => {
            for(let t of e.changedTouches) {
                if (t.identifier === joyTouchId) {
                    joyTouchId = null;
                    moveX = 0; moveZ = 0;
                    knob.style.left = '30px'; knob.style.top = '30px';
                }
                if (t.identifier === lookTouchId) lookTouchId = null;
            }
        });

        // --- 5. DESKTOP INPUTS ---
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
            }
        });
        document.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = 1; });
        document.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = 0; });

        // --- 6. CORE LOOP ---
        const raycaster = new THREE.Raycaster();
        function animate(time) {
            requestAnimationFrame(animate);
            stars.material.opacity = 0.4 + Math.sin(time * 0.002) * 0.3;

            if (isStarted) {
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
                
                const speed = (isBoosting || keys.shift) ? 40 : 12;
                
                // Keyboard Movement
                if(keys.w) camera.translateZ(-speed);
                if(keys.s) camera.translateZ(speed);
                if(keys.a) camera.translateX(-speed);
                if(keys.d) camera.translateX(speed);

                // Joystick Movement
                camera.translateX(moveX * speed);
                camera.translateZ(moveZ * speed);

                // Planet Scanning
                raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
                const hit = raycaster.intersectObjects(planets);
                if (hit.length > 0) {
                    document.getElementById('target-name').innerText = hit[0].object.userData.name;
                    document.getElementById('target-dist').innerText = "Range: " + Math.floor(hit[0].distance) + " ly";
                }
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
