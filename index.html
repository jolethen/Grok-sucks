<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Engine: Odyssey</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; color: #fff; user-select: none; }
        #hud { position: absolute; bottom: 20px; left: 20px; pointer-events: none; z-index: 10; background: rgba(0, 20, 40, 0.8); padding: 15px; border: 1px solid #00ffff; border-radius: 8px; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 24px; height: 24px; border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 50%; z-index: 10; transition: all 0.2s; }
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 2px; height: 2px; background: #00ffff; }
        #instructions { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; cursor: pointer; text-align: center; }
        h1 { color: #00ffff; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 5px; }
        .highlight { color: #00ffff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="instructions">
        <h1>UNIVERSE LOADED</h1>
        <p>Click to Engage <span class="highlight">Warp Drive</span></p>
        <p>Controls: <span class="highlight">WASD</span> + <span class="highlight">MOUSE</span> | Boost: <span class="highlight">SHIFT</span></p>
    </div>

    <div id="crosshair"></div>

    <div id="hud">
        <div id="target-name" style="font-size: 1.2rem; color: #00ffff;">Scanning...</div>
        <div id="target-dist" style="font-size: 0.9rem; color: #aaa;">Range: 0 ly</div>
        <div id="speed-ind" style="margin-top: 10px; font-size: 0.8rem; border-top: 1px solid #333; pt-5px;">THRUST: 0%</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 20000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Lights
        const sunLight = new THREE.PointLight(0xffffff, 2, 10000);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x333333));

        // --- TWINKLING STARFIELD ---
        const starGeo = new THREE.BufferGeometry();
        const starCount = 8000;
        const starPositions = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);

        for(let i=0; i < starCount * 3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 15000;
        }
        for(let i=0; i < starCount; i++) {
            starSizes[i] = Math.random() * 2;
        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));

        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, transparent: true });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // --- PLANET GENERATOR (30 Real 3D Objects) ---
        const planets = [];
        const planetTypes = [
            { name: 'Magma World', color: 0xff4400, emissive: 0x330000 },
            { name: 'Ice Giant', color: 0x00ffff, emissive: 0x001133 },
            { name: 'Toxic Swamp', color: 0x44ff44, emissive: 0x002200 },
            { name: 'Desert Planet', color: 0xffcc88, emissive: 0x221100 },
            { name: 'Terran-Like', color: 0x2244ff, emissive: 0x000022 }
        ];

        for (let i = 0; i < 30; i++) {
            const type = planetTypes[Math.floor(Math.random() * planetTypes.length)];
            const radius = 40 + Math.random() * 60;
            
            // Create Planet Sphere
            const geo = new THREE.SphereGeometry(radius, 64, 64);
            const mat = new THREE.MeshStandardMaterial({
                color: type.color,
                emissive: type.emissive,
                roughness: 0.7,
                metalness: 0.2,
                flatShading: false
            });
            
            const planet = new THREE.Mesh(geo, mat);
            
            // Random Position
            planet.position.set(
                (Math.random() - 0.5) * 8000,
                (Math.random() - 0.5) * 8000,
                (Math.random() - 0.5) * 8000
            );

            // Add an Atmosphere Glow
            const atmosGeo = new THREE.SphereGeometry(radius * 1.1, 32, 32);
            const atmosMat = new THREE.MeshBasicMaterial({
                color: type.color,
                transparent: true,
                opacity: 0.15,
                side: THREE.BackSide
            });
            const atmosphere = new THREE.Mesh(atmosGeo, atmosMat);
            planet.add(atmosphere);

            // 40% chance for Rings
            if(Math.random() > 0.6) {
                const ringGeo = new THREE.RingGeometry(radius * 1.4, radius * 2.2, 64);
                const ringMat = new THREE.MeshBasicMaterial({ 
                    color: type.color, 
                    side: THREE.DoubleSide, 
                    transparent: true, 
                    opacity: 0.4 
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                planet.add(ring);
            }

            planet.userData = { name: `${type.name} ${Math.floor(Math.random() * 999)}` };
            scene.add(planet);
            planets.push(planet);
        }

        // --- CONTROLS ---
        let isLocked = false;
        const ins = document.getElementById('instructions');
        ins.addEventListener('click', () => document.body.requestPointerLock());

        document.addEventListener('pointerlockchange', () => {
            isLocked = (document.pointerLockElement === document.body);
            ins.style.display = isLocked ? 'none' : 'flex';
        });

        let pitch = 0, yaw = 0;
        document.addEventListener('mousemove', (e) => {
            if (!isLocked) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
            camera.rotation.set(pitch, yaw, 0, 'YXZ');
        });

        const keys = { w:0, a:0, s:0, d:0, shift:0 };
        document.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = 1; });
        document.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = 0; });

        // --- RAYCASTER ---
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2(0, 0);

        // --- MAIN LOOP ---
        function animate(time) {
            requestAnimationFrame(animate);

            // Twinkle stars using Sine wave
            stars.material.opacity = 0.5 + Math.sin(time * 0.002) * 0.5;

            if (isLocked) {
                const speed = keys.shift ? 45 : 12;
                const dir = new THREE.Vector3(keys.d - keys.a, 0, keys.s - keys.w).normalize();
                camera.translateX(dir.x * speed);
                camera.translateZ(dir.z * speed);

                document.getElementById('speed-ind').innerText = `THRUST: ${keys.w || keys.s || keys.a || keys.d ? (keys.shift ? '200%' : '100%') : '0%'}`;

                // Scanning
                raycaster.setFromCamera(pointer, camera);
                const intersects = raycaster.intersectObjects(planets);
                const cross = document.getElementById('crosshair');
                
                if (intersects.length > 0) {
                    const p = intersects[0];
                    document.getElementById('target-name').innerText = p.object.userData.name;
                    document.getElementById('target-dist').innerText = `Range: ${Math.floor(p.distance)} ly`;
                    cross.style.borderColor = '#ff00ff';
                    cross.style.width = '40px';
                    cross.style.height = '40px';
                } else {
                    document.getElementById('target-name').innerText = "Deep Space";
                    document.getElementById('target-dist').innerText = `Range: ---`;
                    cross.style.borderColor = 'rgba(0, 255, 255, 0.3)';
                    cross.style.width = '24px';
                    cross.style.height = '24px';
                }
            }

            // Rotate Planets
            planets.forEach(p => p.rotation.y += 0.005);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
